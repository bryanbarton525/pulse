apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pulse.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - canary.iambarton.com
  resources:
  - anomalypolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - canary.iambarton.com
  resources:
  - anomalypolicies/status
  - grpccanaries/status
  - httpcanaries/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - canary.iambarton.com
  resources:
  - grpccanaries
  - httpcanaries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - canary.iambarton.com
  resources:
  - grpccanaries/finalizers
  - httpcanaries/finalizers
  verbs:
  - update
