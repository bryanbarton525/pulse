---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: grpccanaries.canary.iambarton.com
spec:
  group: canary.iambarton.com
  names:
    kind: GrpcCanary
    listKind: GrpcCanaryList
    plural: grpccanaries
    singular: grpccanary
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GrpcCanary is the Schema for the grpccanaries API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GrpcCanary
            properties:
              intelligence:
                description: |-
                  Intelligence opts this canary into model-driven evaluation. gRPC probes
                  have no response body, so bodyDrift does not apply — but latency shift,
                  failure correlation, and novelty routing all do.
                properties:
                  enabled:
                    default: true
                    type: boolean
                  overrides:
                    description: Overrides tunes a few thresholds for this canary
                      only.
                    properties:
                      driftThreshold:
                        pattern: ^[0-9]+(\.[0-9]+)?$
                        type: string
                      latencyZScoreThreshold:
                        pattern: ^[0-9]+(\.[0-9]+)?$
                        type: string
                      warmupChecks:
                        minimum: 2
                        type: integer
                    type: object
                  policyRef:
                    description: PolicyRef selects the AnomalyPolicy governing this
                      canary.
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace defaults to the canary's own namespace.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - policyRef
                type: object
              interval:
                default: 30
                description: Interval is the frequency in seconds to run the check.
                minimum: 5
                type: integer
              outputs:
                default:
                - type: prometheus
                description: Outputs configure where Pulse emits probe telemetry for
                  this canary.
                items:
                  description: HttpCanaryOutput defines one destination for canary
                    execution telemetry.
                  properties:
                    type:
                      description: Type is the output sink for the canary.
                      enum:
                      - prometheus
                      - stdout
                      type: string
                  required:
                  - type
                  type: object
                type: array
              service:
                description: |-
                  Service is the gRPC service name to check using the standard grpc.health.v1.Health protocol.
                  If omitted, the server's overall health is checked.
                type: string
              url:
                description: URL is the gRPC endpoint to check (e.g., localhost:50051)
                minLength: 1
                type: string
            required:
            - url
            type: object
          status:
            description: status defines the observed state of GrpcCanary
            properties:
              conditions:
                description: conditions represent the current state of the GrpcCanary
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              intelligence:
                description: |-
                  Intelligence reports what the model concluded about this canary.
                  Only populated when spec.intelligence is set.
                properties:
                  incidentID:
                    description: IncidentID groups canaries that failed together for
                      the same reason.
                    type: string
                  investigation:
                    description: Investigation is the language model's root-cause
                      analysis, in Markdown.
                    maxLength: 8192
                    type: string
                  lastSignalTime:
                    format: date-time
                    type: string
                  policy:
                    description: Policy is the AnomalyPolicy that evaluated this canary
                      ("namespace/name").
                    type: string
                  role:
                    description: Role is rootCause or downstream.
                    enum:
                    - rootCause
                    - downstream
                    type: string
                  score:
                    description: Score is the trigger's score, formatted as a decimal
                      string.
                    type: string
                  trigger:
                    description: Trigger names which evaluation produced the signal.
                    enum:
                    - bodyDrift
                    - latencyShift
                    - failureCorrelation
                    - failureNovelty
                    type: string
                type: object
              lastCheckTime:
                description: LastCheckTime is the timestamp of the most recent probe
                  execution.
                format: date-time
                type: string
              lastStatus:
                description: LastStatus is the status code from the most recent probe
                  (using gRPC status codes).
                type: integer
              message:
                description: Message contains human-readable details about the most
                  recent probe execution.
                type: string
              phase:
                description: Phase represents the current health state (e.g. Healthy,
                  Unhealthy, Unknown).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
