                          type: string
                        credentialSecretRef:
                          description: |-
                            CredentialSecretRef holds the API key, token, or password for the
                            provider. Interpretation depends on Provider.
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
