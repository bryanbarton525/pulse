                  - type
                  type: object
                type: array
              incidents:
                description: Incidents controls notification behavior for incident
                  members.
                properties:
                  notifyOnDownstream:
                    description: |-
                      NotifyOnDownstream sends a short "suppressed, part of incident X" note
                      when a canary under this policy is a downstream victim rather than the
                      root cause. Off by default — collapsing the storm is the whole point.
                    type: boolean
                type: object
              model:
                description: Model selects the embedding models. Omit for the baked-in
                  defaults.
                properties:
                  cold:
                    description: |-
                      Cold configures the embedder used for failure correlation and novelty,
                      which only runs on failures.

                      This setting is CLUSTER-WIDE, not per-policy. Correlation merges failures
                      across canaries governed by different policies -- a service and its
                      database rarely share one -- by comparing their failure vectors, and
                      vectors from different models are not comparable. If policies disagree,
                      the incident engine resolves to one deterministically (first by policy
                      name) and logs the ones it ignored.
                    properties:
                      backend:
                        default: onnx
                        description: |-
                          Backend selects between the in-process ONNX runtime and an external
                          OpenAI-compatible embeddings service.
                        enum:
                        - onnx
                        - http
                        type: string
                      http:
                        description: |-
                          HTTP configures an external embeddings endpoint. Used when backend is "http".

                          NOTE: this must be a server running an EMBEDDING model. A generation
                          server (for example SGLang serving a chat model) rejects /v1/embeddings
                          unless it was launched with --is-embedding.
                        properties:
                          apiKeySecretRef:
                            description: APIKeySecretRef supplies a bearer token for
                              the endpoint.
                            properties:
                              key:
                                description: The key of the secret to select from.  Must
                                  be a valid secret key.
                                type: string
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                              optional:
                                description: Specify whether the Secret or its key
                                  must be defined
                                type: boolean
                            required:
                            - key
                            type: object
                            x-kubernetes-map-type: atomic
                          endpoint:
                            description: Endpoint is the full embeddings URL.
                            minLength: 1
                            type: string
                          model:
                            description: Model is the model name passed in the request
                              body.
                            type: string
                        required:
                        - endpoint
                        type: object
                      onnx:
                        description: ONNX configures the in-process transformer. Used
                          when backend is "onnx".
                        properties:
                          maxSequenceLength:
                            default: 256
                            minimum: 16
                            type: integer
                          modelPath:
                            type: string
                          vocabPath:
                            type: string
                        type: object
                    type: object
                  hot:
                    description: |-
                      Hot configures the embedder used on the body-drift path, which runs on
                      every passing check. This setting is cluster-wide: all runner shards must
                      produce vectors in the same embedding space. Conflicts are resolved
                      deterministically by policy name and reported by the operator.
                    properties:
                      backend:
                        default: potion
                        description: Backend selects the hot-path implementation.
                        enum:
                        - potion
                        type: string
                      maxSequenceLength:
                        default: 256
                        description: MaxSequenceLength caps tokens per document.
                        minimum: 16
                        type: integer
                      modelPath:
                        description: |-
                          ModelPath is the path INSIDE the probe runner image to the converted
                          static embedding matrix. Override it only when you have baked or mounted
                          your own model.
                        type: string
                      vocabPath:
                        description: VocabPath is the path inside the probe runner
                          image to the tokenizer vocab.
                        type: string
                    type: object
                type: object
              privacy:
                description: |-
