  name: pulse-allow-metrics-traffic
  namespace: pulse-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          metrics: enabled
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pulse
      control-plane: controller-manager
  policyTypes:
  - Ingress
