name: Book build

on:
  pull_request:
    paths: ['book/**', 'book.toml', 'docs/**', '.github/workflows/docs.yml']
  push:
    branches: [main, feat/model-intelligence]
    paths: ['book/**', 'book.toml', 'docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned mdBook
        env:
          MDBOOK_VERSION: '0.4.52'
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin"
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"
      - name: Build book
        run: mdbook build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-book
          path: book/build/
          if-no-files-found: error
