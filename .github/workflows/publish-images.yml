name: Publish Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Nested under the pulse repo so GITHUB_TOKEN can push. User-level packages
  # (bryanbarton525/pulse-controller and siblings) were created by a personal
  # PAT and block Actions with permission_denied: read_package.
  CONTROLLER_IMAGE_BASENAME: controller
  PROBE_RUNNER_IMAGE_BASENAME: probe-runner
  INCIDENT_ENGINE_IMAGE_BASENAME: incident-engine

jobs:
  publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest

    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Derive image repository names
        id: image-names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "controller=${{ env.REGISTRY }}/${repo}/${{ env.CONTROLLER_IMAGE_BASENAME }}" >> "$GITHUB_OUTPUT"
          echo "probe_runner=${{ env.REGISTRY }}/${repo}/${{ env.PROBE_RUNNER_IMAGE_BASENAME }}" >> "$GITHUB_OUTPUT"
          echo "incident_engine=${{ env.REGISTRY }}/${repo}/${{ env.INCIDENT_ENGINE_IMAGE_BASENAME }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry with GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight GHCR package access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for package in \
            "${{ env.CONTROLLER_IMAGE_BASENAME }}" \
            "${{ env.PROBE_RUNNER_IMAGE_BASENAME }}" \
            "${{ env.INCIDENT_ENGINE_IMAGE_BASENAME }}"; do
            token="$(curl --silent --show-error --fail \
              --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${owner}/${package}:pull,push" \
              | jq --raw-output '.token')"
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/${owner}/${package}/tags/list")"
            case "${status}" in
              200|404) ;;
              *) echo "GHCR access preflight failed for ${package} (HTTP ${status})" >&2; exit 1 ;;
            esac
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch embedding models
        run: |
          # The probe runner and incident engine images bake these in. They are
          # gitignored, so without this step the published images would start
          # up, fail to load a model, and disable the triggers.
          make fetch-models

      - name: Extract controller image metadata
        id: controller-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.controller }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Extract probe runner image metadata
        id: probe-runner-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.probe_runner }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Extract incident engine image metadata
        id: incident-engine-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.incident_engine }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.controller-meta.outputs.tags }}
          labels: ${{ steps.controller-meta.outputs.labels }}

      - name: Build and push probe runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.proberunner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.probe-runner-meta.outputs.tags }}
          labels: ${{ steps.probe-runner-meta.outputs.labels }}

      - name: Build and push incident engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.incidentengine
          # ONNX Runtime publishes binaries only for these two architectures,
          # so this image cannot target the wider list the others use.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.incident-engine-meta.outputs.tags }}
          labels: ${{ steps.incident-engine-meta.outputs.labels }}

  release:
    name: Create Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Derive controller image name
        id: image-names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "controller=${{ env.REGISTRY }}/${repo}/${{ env.CONTROLLER_IMAGE_BASENAME }}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
          IMG: ${{ steps.image-names.outputs.controller }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${VERSION#v}"

          make build-installer
          for crd in httpcanaries grpccanaries anomalypolicies; do
            cp "config/crd/bases/canary.iambarton.com_$crd.yaml" \
               "dist/chart/crds/$crd.canary.iambarton.com.yaml"
          done

          perl -0pi -e "s/^version:\s+.*/version: ${RELEASE_VERSION}/m; s/^appVersion:\s+.*$/appVersion: \"${RELEASE_VERSION}\"/m" dist/chart/Chart.yaml

          mkdir -p dist/releases
          helm package dist/chart --destination dist/releases
          cp dist/install.yaml "dist/releases/pulse-install-${VERSION}.yaml"
          sha256sum dist/releases/* > dist/releases/checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/releases/pulse-install-${{ github.ref_name }}.yaml
            dist/releases/pulse-*.tgz
            dist/releases/checksums.txt
