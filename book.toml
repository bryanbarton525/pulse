[book]
title = "The Pulse Book"
authors = ["Pulse contributors"]
language = "en"
src = "book/src"

[build]
build-dir = "book/build"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/bryanbarton525/pulse"
edit-url-template = "https://github.com/bryanbarton525/pulse/edit/main/book/src/{path}"
site-url = "/book/"
additional-js = ["book/src/vendor/mermaid.min.js", "book/src/diagrams.js"]

[output.html.fold]
enable = true
level = 1
