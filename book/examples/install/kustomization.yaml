apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../config/default
images:
  - name: controller
    newName: localhost/pulse-controller
    newTag: book-v1
patches:
  - target:
      kind: Deployment
      name: pulse-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pulse-controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: PULSE_PROBE_RUNNER_IMAGE
                    value: localhost/pulse-probe-runner:book-v1
                  - name: PULSE_INCIDENT_ENGINE_IMAGE
                    value: localhost/pulse-incident-engine:book-v1
